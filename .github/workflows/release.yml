name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create

# 1 つのタグで macOS・Windows・Linux を作り、1 つの Release に載せる（CLAUDE.md「両プラットフォームのリリース方針」）。
# 下書きの Release を作る → 各 OS のジョブが成果物を載せる → 全部そろったら公開する。
# 公開の前に片方の OS の分しか無い状態を作らない（アップデータが自分の OS の配布物を見つけられなくなるため）。
# 配布物の名前: macOS は iroha-<版>.zip（配布済みの UpdateChecker が「iroha- で始まり .zip で終わる」ものを取るので変えない）、
# Windows は iroha-<版>-windows-x64-setup.exe（.zip にしない）
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "iroha ${GITHUB_REF_NAME#v}" --generate-notes $PRERELEASE

  release:
    needs: draft
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # FoundationModels(英訳機能)のcanImportにはmacOS 26 SDKが必要。
      # 古いSDKでビルドすると英訳機能が黙って消えるため、後段のotool検証と併せて防ぐ
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # 追加学習ヘルパー（MLX）の Metal カーネルをコンパイルするのに必要。
      # Xcode 26 では別コンポーネント（既にあれば何もしない）
      - name: Install Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version

      - name: Cache llama.cpp static libs
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: vendor/dist
          key: llama-${{ runner.os }}-${{ runner.arch }}-b10689-${{ hashFiles('patches/llama-cpp-zenz-pretokenizer.patch', 'macos/scripts/build-llama.sh') }}

      - name: Build llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: ./macos/scripts/build-llama.sh

      # 辞書ラティス用のazooKey辞書（約35MB、コミット固定。make-bundle.sh がバンドルへコピーする）
      - name: Fetch azooKey dictionary
        run: ./macos/scripts/fetch-dictionary.sh

      # 記号・顔文字・絵文字の候補に使う Mozc のデータ（約500KB、コミット固定。make-bundle.sh がバンドルへコピーする）
      - name: Fetch Mozc symbol data
        run: ./macos/scripts/fetch-symbols.sh

      - name: Build
        working-directory: macos
        run: |
          swift build --build-system native -c release --product iroha
          swift build --build-system native -c release --product iroha-train
          ./scripts/build-mlx-metallib.sh release
          test -f .build/release/mlx-swift_Cmlx.bundle/default.metallib

      - name: Verify FoundationModels linkage
        run: |
          otool -l macos/.build/release/iroha | grep -q FoundationModels.framework \
            || { echo "::error::FoundationModels not linked - SDK too old, 英訳機能が消えています"; exit 1; }

      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASS: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Assemble and sign bundle
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" BUILD_NUMBER="${{ github.run_number }}" ./macos/scripts/make-bundle.sh
          codesign --verify --strict --verbose=2 macos/.build/iroha.app

      - name: Notarize and staple
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent macos/.build/iroha.app "$RUNNER_TEMP/iroha-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/iroha-notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "${{ secrets.NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.NOTARY_ISSUER_ID }}" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple macos/.build/iroha.app
          ditto -c -k --keepParent macos/.build/iroha.app "iroha-$VERSION.zip"

      - name: Verify Gatekeeper acceptance
        run: spctl --assess --type execute --verbose=4 macos/.build/iroha.app

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "iroha-$VERSION.zip" --clobber

  # Windows版（iroha-<版>-windows-x64-setup.exe。Inno Setup のインストーラー。設定画面のアップデータがこれを取る）
  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache llama.cpp static libs
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: vendor/dist-windows
          key: llama-${{ runner.os }}-${{ runner.arch }}-b10689-${{ hashFiles('patches/llama-cpp-zenz-pretokenizer.patch', 'windows/scripts/build-llama.ps1') }}

      - name: Build llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File windows/scripts/build-llama.ps1 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            ($out | Select-Object -Last 25) | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # ビルド・単体テスト・辞書と記号のデータの取得・インストーラーの作成（版はタグから）
      - name: Build installer
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace "^v", ""
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File windows/scripts/make-installer.ps1 -Version $version 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            ($out | Select-Object -Last 25) | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" "windows/build/installer/iroha-$env:VERSION-windows-x64-setup.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # 全部の OS の成果物がそろったら公開する（どれかが失敗したら下書きのまま残る。直してから再実行するか、手で公開する）
  publish:
    needs: [release, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
