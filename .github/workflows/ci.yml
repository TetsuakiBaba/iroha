name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # FoundationModels(英訳機能)のcanImportにはmacOS 26 SDKが必要
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache llama.cpp static libs
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: vendor/dist
          key: llama-${{ runner.os }}-${{ runner.arch }}-b10689-${{ hashFiles('patches/llama-cpp-zenz-pretokenizer.patch', 'macos/scripts/build-llama.sh') }}

      - name: Build llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: ./macos/scripts/build-llama.sh

      # 辞書ラティス用のazooKey辞書（約35MB、コミット固定。make-bundle.sh がバンドルへコピーする）
      - name: Fetch azooKey dictionary
        run: ./macos/scripts/fetch-dictionary.sh

      # 記号・顔文字・絵文字の候補に使う Mozc のデータ（約500KB、コミット固定。make-bundle.sh がバンドルへコピーする）
      - name: Fetch Mozc symbol data
        run: ./macos/scripts/fetch-symbols.sh

      - name: Build
        working-directory: macos
        run: swift build --build-system native

      - name: Test
        working-directory: macos
        run: swift test --build-system native

  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache llama.cpp static libs
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: vendor/dist-windows
          key: llama-${{ runner.os }}-${{ runner.arch }}-b10689-${{ hashFiles('patches/llama-cpp-zenz-pretokenizer.patch', 'windows/scripts/build-llama.ps1') }}

      # 失敗時はログ末尾をアノテーションに出す（公開APIから読めるように）
      - name: Build llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File windows/scripts/build-llama.ps1 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            ($out | Select-Object -Last 25) | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      # 辞書ラティス用のazooKey辞書（約35MB、コミット固定）。単体テストの辞書ラティスの部分が読む
      # （無いとその部分だけスキップされる）
      - name: Fetch azooKey dictionary
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows/scripts/fetch-dictionary.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 記号・顔文字・絵文字の Mozc のデータ（約1MB、コミット固定）。単体テストの実データの部分が読む
      - name: Fetch Mozc symbol data
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows/scripts/fetch-symbols.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # iroha-core/engine/cli/server/tip のビルドと単体テスト
      - name: Build and test
        shell: pwsh
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File windows/scripts/build-tip.ps1 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            ($out | Select-Object -Last 25) | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

  build-and-test-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # IBus のエンジン・設定画面（GTK4）・選択テキストのAI編集（X11）・fcitx5 のエンジンを作るのに要るもの。
      # fonts-noto-color-emoji は描けない絵文字の判定の単体テスト用
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libibus-1.0-dev libglib2.0-dev libgtk-4-dev \
            libcurl4-openssl-dev libsecret-1-dev libfontconfig-dev libfreetype-dev libharfbuzz-dev \
            libx11-dev libxtst-dev libxi-dev libxfixes-dev libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fonts-noto-color-emoji

      - name: Cache llama.cpp static libs
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: vendor/dist-linux
          key: llama-${{ runner.os }}-${{ runner.arch }}-b10689-${{ hashFiles('patches/llama-cpp-zenz-pretokenizer.patch', 'linux/scripts/build-llama.sh') }}

      - name: Build llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: ./linux/scripts/build-llama.sh

      # 辞書ラティスの辞書と記号のデータ（macOS版と同じスクリプト・同じコミット）。単体テストの実データの部分が読む
      - name: Fetch dictionary and symbol data
        run: |
          ./macos/scripts/fetch-dictionary.sh
          ./macos/scripts/fetch-symbols.sh

      - name: Build and test
        run: |
          cmake -S linux -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/build
          ctest --test-dir linux/build --output-on-failure
