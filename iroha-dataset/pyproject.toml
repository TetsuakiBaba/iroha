[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iroha-dataset"
version = "0.1.0"
description = "iroha 日本語入力システム用の学習データセット生成パイプライン（かな漢字変換 / typo normalizer）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tetsuaki Baba" }]
dependencies = [
    "sudachipy>=0.6.8",
    "sudachidict-full>=20230110",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
core = ["sudachidict-core>=20230110"]

[project.scripts]
iroha-dataset = "iroha_dataset.cli:main"

[tool.setuptools.packages.find]
include = ["iroha_dataset*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
